{{- if .Values.enableCustomizedTruststore }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "otdsws.name" . }}-certs
{{- if and .Values.migration.enabled .Values.migration.preUpgradeJob.enabled .Release.IsUpgrade }}
  annotations:
    "meta.helm.sh/release-name": {{ .Release.Name | quote }}
{{- if .Values.global.namespace }}
    "meta.helm.sh/release-namespace": {{ .Values.global.namespace | quote }}
{{- else }}
    "meta.helm.sh/release-namespace": {{ .Release.Namespace | quote }}
{{- end }}
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/resource-policy": keep
{{- end }}
{{- if .Values.global.namespace }}
  namespace: {{ .Values.global.namespace }}
{{- end }}
  labels:
    {{- include (printf "%s%s" .Chart.Name ".labels") . | nindent 4 }}
type: Opaque
data:
{{- if .Values.singleCaCert }}
  rootCA.crt: {{ .Values.singleCaCert | b64enc | quote }}
{{- else }}
{{- range $path, $_ := .Files.Glob "certificates/*" }}
{{- $subdir := dir $path }}
{{- $currentFilename := ($path | replace (printf "%s/" $subdir) "") }}
  {{ $currentFilename }}: {{ tpl ($.Files.Get $path) $ | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}