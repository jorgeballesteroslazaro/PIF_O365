    password: *db_admin_password

    # Description: Certificate information of the database. Make sure that you change the default value 
    # according to your requirement.
    certificate: ""
      
  newrelic:
    # Description: This variable uses the value that you specified for licenseKey in Global Variables.
    license_key: *newrelic_license_key

  # Description: Contents of the JSON file generated on Google Cloud store.
  # Use the following format:
  # gcpStore_credentials: |
  # {
  # JSON credential Object of GCP store.
  # }
  # If Vault is enabled, provide the Google Cloud storage type service account credentials
  # secret ID. For more information about the secret ID, see OpenText Documentum Content 
  # Management - Server Administration and Configuration Guide.
  gcpStore_credentials:

  # Description: Use OpenSSL or any other utilities to generate key and certificate.
  # For example, use the following command format to generate a private key
  # file (KEY_FILE.crt) and a certificate (CERT_FILE.crt) for a given domain:
  # openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout KEY_FILE.crt
  # -out CERT_FILE.crt -subj "/CN=<domain name>/O=<domain name>"
  # Then, convert the key and certificate to the Base64-encoded format.
  # If the host name (CN name) specified during the certificate request process 
  # does not match the host defined in your ingress route, your Ingress Controller 
  # displays a Kubernetes Ingress Controller Fake Certificate warning.
  # Note: If you are using multiple ingresses (value of global.multiIngress set to true) and
  # if you have set the value of global.internalTlsEnable to true, make sure that the certificate (cs-secrets.ingress.tlscrt)
  # allows all the domains mentioned in your ingresses. 
  ingress:
    # Description: Base64-encoded TLS certificate in one line without any carriage returns or line wrap.
    tlscrt:

    # Description: Base64-encoded TLS key in one line without any carriage returns or line wrap.
    tlskey:

    # Description: Ingress key store password used to enable the backend TLS.
    keystorepassword: # Description: commonTrustsorecreate is enabled then please enter this value which is used as trust store password for common trust store creation.
  commonTruststore:
    commontlscrt:
    commontlskey:
    password:
  clients:
    # Description: Service account password to connect to Reports.
    drServiceAccountPassword: Training_2026_25_4

    # Description: Preference password information.
    preferencePassword: Training_2026_25_4

    # Description: Preset password information.
    presetPassword: Training_2026_25_4
  documentumsearch:
    # Description: Solr authentication password used to connect to Solr. The fixed value for this variable is Password@123.
    solr_auth_password:
docbroker:
